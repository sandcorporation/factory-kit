# Factory task: Odin (spec #249 "Odin", docs/adr/0001-software-factory.md)
#
# Decompose opens the spec PR (head factory/spec-<S>, label spec-pr: each ticket's acceptance tests
# with #[ignore = "#<ticket>"]) and dispatches this run. Odin (Opus, ${{ env.FACTORY_KIT }}/factory/odin.md) checks
# the tickets and tests against the code, the earlier specs' merged spec_* tests, AGENTS.md, the ADRs
# and the glossary, fixes what it can (test files, ticket bodies, the todo!("#<ticket>") stubs that make
# the tests compile) and asks (wait:decision) when the fix would change scope or a user-visible choice.
# The workflow then runs the quick checks (checks.quick in .github/factory.yml)
# (the ignored tests only compile: this is the compile check), then the acceptance probe (#414,
# ${{ env.FACTORY_KIT }}/factory/acceptance-probe.sh: the spec PR's ignored tests run once and must fail on an
# assertion or a todo! stub, not on a compile error, another panic, or pass). A failure goes back to the agent once in
# the same run; a second failure hands the spec to a human. On a pass the workflow pushes the fixes,
# squash-merges the spec PR, labels the spec's open tickets state:ready and dispatches the first
# one (${{ env.FACTORY_KIT }}/factory/odin.sh).
# Conflicts with main (#359): main is merged into the spec branch, not rebased onto, and pushed with a
# plain push. A conflict is resolved by an agent in this run ("Resolve conflicts"), then the checks
# are `${{ env.FACTORY_CHECK }}`. When the squash merge fails (main moved again), a new run is dispatched with
# mode=conflict: it merges main again, resolves without a new review, checks, pushes and merges. The
# rounds are counted on the spec PR (`odin.sh conflict`, ODIN_CONFLICT_LIMIT, default 2); past the
# limit the spec goes to a human with the conflicting files.
# Trigger: Decompose and the resume job dispatch it with the spec number, or a manual run.
name: factory-odin
run-name: 'odin #${{ inputs.spec }}'

on:
  workflow_call:
    inputs:
      kit-repository:
        description: owner/name of the factory kit
        type: string
        required: true
      kit-ref:
        description: tag, branch or commit of the kit (pin a tag or a commit)
        type: string
        required: true
      spec:
        type: string
        required: false
        description: Spec issue number whose spec PR to review
      mode:
        type: string
        required: false
        description: 'review: review the spec PR (default); conflict: only merge main in and resolve (#359)'
        options: [review, conflict]

    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: factory-odin-${{ inputs.spec }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  # dispatch-next.sh (starting the chain with the approved tickets as --candidates) and ledger.sh read
  # these.
  FACTORY_SPEC_QUEUE: ${{ vars.FACTORY_SPEC_QUEUE }}
  FACTORY_SPEC_BUDGET_USD: ${{ vars.FACTORY_SPEC_BUDGET_USD }}
  FACTORY_DAILY_BUDGET_USD: ${{ vars.FACTORY_DAILY_BUDGET_USD }}
  FACTORY_TRACKS: ${{ vars.FACTORY_TRACKS }}

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runners_default }}
      implement: ${{ steps.cfg.outputs.runners_implement }}
      verify: ${{ steps.cfg.outputs.runners_verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/factory.yml
          sparse-checkout-cone-mode: false
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"

  odin:
    needs: config
    runs-on: ${{ needs.config.outputs.implement }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SPEC: ${{ inputs.spec }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      - name: App token (push, pull requests, merge only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Hand the App token to the push, pull request and merge commands
        shell: bash
        run: echo "FACTORY_APP_TOKEN=${{ steps.app.outputs.token }}" >> "$GITHUB_ENV"

      # Spec #249 "비용 장부와 상한": stop on wait:decision / wait:budget and on the budgets.
      - name: Budget guard
        id: budget
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh guard "$SPEC"

      # none (no open spec PR: warn and stop) / empty (no test: close it and start the tickets) /
      # review (${{ env.FACTORY_KIT }}/factory/odin.sh state).
      - name: Find the spec PR
        id: state
        if: steps.budget.outputs.go == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/odin.sh state "$SPEC"

      - name: Start the tickets without acceptance tests
        if: steps.state.outputs.mode == 'empty'
        run: bash ${{ env.FACTORY_KIT }}/factory/odin.sh empty "$SPEC" "${{ steps.state.outputs.pr }}"

      # Review the spec PR on today's main: the merge must land what the checks checked. Main is merged
      # in, not rebased onto (#359, as Verify does since #307): a resolved conflict leaves a merge
      # commit, which a rebase would replay into the same conflict again, and the push stays a plain
      # push (the PR is squashed anyway). A conflict either goes to the agent ("Resolve conflicts"),
      # or, past the rounds limit (odin.sh conflict), to a human with the conflicting files.
      # In mode=conflict the spec PR passed its review in an earlier run, whose merge then failed:
      # the verdict is pass and that run already counted this round.
      - name: Check out the spec PR
        id: pr
        if: steps.state.outputs.mode == 'review'
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          PR: ${{ steps.state.outputs.pr }}
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "${{ env.FACTORY_GIT_NAME }}"
          git config user.email "${{ env.FACTORY_GIT_EMAIL }}"
          git fetch origin "$BASE" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git switch -C "$BRANCH" "origin/$BRANCH"
          mkdir -p .factory
          echo ".factory/" >> .git/info/exclude
          echo "*.log" >> .git/info/exclude
          if [ "$MODE" = conflict ]; then
            echo pass > .factory/odin-verdict
            echo "- 앞 run의 병합이 실패해 $BASE를 다시 merge했다(검토는 앞 run이 마쳤다)" > .factory/odin-report.md
          fi
          if git merge --no-edit "origin/$BASE"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=U > .factory/conflict-files
          echo "::warning::conflicts with $BASE: $(tr '\n' ' ' < .factory/conflict-files)"
          if [ "$MODE" = conflict ] \
            || bash ${{ env.FACTORY_KIT }}/factory/odin.sh conflict "$SPEC" "$PR" .factory/conflict-files .factory/human.md; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            cat .factory/human.md
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository setup

        shell: bash

        run: ${{ env.FACTORY_SETUP || 'true' }}

      - if: env.FACTORY_CACHE == 'rust'

        uses: Swatinem/rust-cache@v2
        if: steps.pr.outputs.go == 'true'

      # The action's own installer is a shell script that refuses Windows, so install
      # the native Windows build and hand the action its path.
      - name: Install Claude Code
        id: claude
        if: steps.pr.outputs.go == 'true'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
          if (-not (Test-Path $exe)) { throw "claude.exe not found at $exe" }
          & $exe --version
          "path=$exe" >> $env:GITHUB_OUTPUT

      # Spec PRs hold ignored acceptance tests and todo! stubs, so a conflict is mostly both sides
      # adding to the same enum, match or list: keep both (#359).
      - name: Resolve conflicts
        if: steps.claude.outcome == 'success' && steps.pr.outputs.conflict == 'true'
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Odin run for spec #${{ env.SPEC }} in ${{ github.repository }}, spec PR #${{ steps.state.outputs.pr }}
            (branch ${{ steps.state.outputs.branch }}, checked out). Other work merged into ${{ env.BASE }} meanwhile, and
            merging origin/${{ env.BASE }} into the branch left conflicts (see `git status`; the files are listed in
            .factory/conflict-files). The spec PR holds the tickets' acceptance tests (#[ignore = "#<ticket>"]) and
            the todo!("#<ticket>") stubs that make them compile.
            Resolve every conflict so that both sides survive: keep everything ${{ env.BASE }} added and add the spec
            PR's part next to it (both variants in the same enum, both arms in the same match, both entries in the
            same list). Never drop ${{ env.BASE }}'s changes, never weaken what a test asserts, and do not touch what
            does not conflict unless the merged code would not compile otherwise.
            Check with the quick checks (checks.quick in .github/factory.yml) (the workflow then
            runs `${{ env.FACTORY_CHECK }}`), finish with `git commit --no-edit`, and add one line to .factory/odin-report.md
            naming the files you resolved and how. Do not push.
          claude_args: >-
            --model ${{ env.FACTORY_MODELS_ODIN }}
            --max-turns ${{ env.FACTORY_TURNS_CONFLICTS }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (odin-conflict)
        if: always() && steps.claude.outcome == 'success' && steps.pr.outputs.conflict == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record odin-conflict "$SPEC"

      # The agent must leave no conflict and a finished merge. Edits it left uncommitted with every
      # conflict resolved are committed here (the checks below still judge them).
      - name: Require a resolved merge
        id: resolved
        if: steps.pr.outputs.conflict == 'true'
        run: |
          if [ -n "$(git diff --name-only --diff-filter=U)" ] || { [ -s .factory/conflict-files ] && git grep -qE '^(<<<<<<<|>>>>>>>) ' -- $(cat .factory/conflict-files); }; then
            echo "::error::conflicts left: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify MERGE_HEAD > /dev/null || [ -n "$(git status --porcelain)" ]; then
            echo "::warning::the agent did not finish the merge commit; committing it"
            git add -A
            git commit -q --no-edit || git commit -q -m "main을 merge하고 충돌을 푼다 (#$SPEC)"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        if: >-
          steps.claude.outcome == 'success' && inputs.mode != 'conflict' &&
          (steps.pr.outputs.conflict != 'true' || steps.resolved.outputs.ok == 'true')
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Decompose and the resume job dispatch this run with GITHUB_TOKEN: the actor is the bot.
          allowed_bots: github-actions
          prompt: |
            You are the Odin run of this repo's software factory.
            Spec issue: #${{ env.SPEC }} in ${{ github.repository }}.
            Spec PR: #${{ steps.state.outputs.pr }}, branch ${{ steps.state.outputs.branch }} (checked out, ${{ env.BASE }} merged in).
            Read ${{ env.FACTORY_KIT }}/factory/odin.md and follow it exactly.
          claude_args: >-
            --model ${{ env.FACTORY_MODELS_ODIN }}
            --max-turns ${{ env.FACTORY_TURNS_ODIN }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (odin)
        if: always() && steps.claude.outcome == 'success' && steps.review.outcome != 'skipped'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record odin "$SPEC"

      # question (wait:decision, or the verdict file says so) / go (pass, fixed) / missing.
      - name: Read the verdict
        id: verdict
        if: >-
          steps.pr.outputs.go == 'true' &&
          (steps.pr.outputs.conflict != 'true' || steps.resolved.outputs.ok == 'true')
        run: bash ${{ env.FACTORY_KIT }}/factory/odin.sh verdict "$SPEC" .factory/odin-verdict

      # The compile check: the acceptance tests are ignored, so clippy only compiles them. After a
      # resolved conflict the whole of `${{ env.FACTORY_CHECK }}` runs (#359): the merge mixed main's code with
      # the spec PR's, so a build and the tests must pass before it lands.
      - name: Checks (first)
        id: check_first
        if: steps.verdict.outputs.verdict == 'go'
        continue-on-error: true
        env:
          CONFLICT: ${{ steps.pr.outputs.conflict }}
        run: |
          set -o pipefail
          r=0
          if [ "$CONFLICT" = true ]; then
            for exe in $FACTORY_CHECKS_KILL; do
              taskkill //F //T //IM "$exe" > /dev/null 2>&1 || true
            done
            echo "${{ env.FACTORY_CHECK }}" > .factory/check-command
            ${{ env.FACTORY_CHECK }} 2>&1 | tee .factory/check.log || r=1
          else
            echo "$FACTORY_CHECKS_QUICK" > .factory/check-command
            bash -c "$FACTORY_CHECKS_QUICK" 2>&1 | tee .factory/check.log || r=1
          fi
          echo "; bash ${{ env.FACTORY_KIT }}/factory/acceptance-probe.sh origin/$BASE" >> .factory/check-command
          if [ $r -eq 0 ]; then
            bash ${{ env.FACTORY_KIT }}/factory/acceptance-probe.sh "origin/$BASE" 2>&1 | tee -a .factory/check.log || r=1
          fi
          exit $r

      - name: Fix the failed checks
        if: steps.verdict.outputs.verdict == 'go' && steps.check_first.outcome == 'failure'
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Odin run for spec #${{ env.SPEC }} in ${{ github.repository }}, spec PR #${{ steps.state.outputs.pr }}
            (branch ${{ steps.state.outputs.branch }}, checked out). You reviewed and fixed it (and, if
            .factory/conflict-files exists, merged ${{ env.BASE }} in and resolved its conflicts). The workflow then ran
            the checks in .factory/check-command, and they failed.
            Their output is in .factory/check.log (search it for "error", "warning", "FAILED", "panicked" and
            "Diff in" instead of reading it whole). Follow ${{ env.FACTORY_KIT }}/factory/odin.md, section "Make it build".
            A line "acceptance-probe FAILED" means an acceptance test is not red for the right reason: see
            ${{ env.FACTORY_KIT }}/factory/odin.md, "Acceptance probe" (the check output is in .factory/probe-cargo.log).
            Fix the cause (fix the test files, the todo! stubs or a conflict you
            resolved wrongly; never weaken what a test asserts and never drop ${{ env.BASE }}'s changes), check with the
            failing command, and add what you fixed to .factory/odin-report.md.
            Do not commit or push.
          claude_args: >-
            --model ${{ env.FACTORY_MODELS_ODIN }}
            --max-turns ${{ env.FACTORY_TURNS_CONFLICTS }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (odin-fix)
        if: always() && steps.verdict.outputs.verdict == 'go' && steps.check_first.outcome == 'failure'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record odin-fix "$SPEC"

      - name: Checks
        id: check
        if: steps.verdict.outputs.verdict == 'go' && steps.check_first.outcome == 'failure'
        env:
          CONFLICT: ${{ steps.pr.outputs.conflict }}
        run: |
          set -o pipefail
          r=0
          if [ "$CONFLICT" = true ]; then
            for exe in $FACTORY_CHECKS_KILL; do
              taskkill //F //T //IM "$exe" > /dev/null 2>&1 || true
            done
            ${{ env.FACTORY_CHECK }} 2>&1 | tee .factory/check.log || r=1
          else
            bash -c "$FACTORY_CHECKS_QUICK" 2>&1 | tee .factory/check.log || r=1
          fi
          if [ $r -eq 0 ]; then
            bash ${{ env.FACTORY_KIT }}/factory/acceptance-probe.sh "origin/$BASE" 2>&1 | tee -a .factory/check.log || r=1
          fi
          exit $r

      # Odin's fixes and the merge of main land on the factory branch with a plain push (#359): main
      # was merged in above, so the push fast-forwards. A branch that moved meanwhile refuses it.
      - name: Push Odin's fixes
        id: push
        if: >-
          steps.verdict.outputs.verdict == 'go' &&
          (steps.check_first.outcome == 'success' || steps.check.outcome == 'success')
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "스펙: Odin 검토 고침 (#$SPEC)"
          fi
          bash "$FACTORY_KIT/factory/app-git.sh"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Merge, or ask, or hand to a human
        if: always() && steps.pr.outputs.go != ''
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          PR: ${{ steps.state.outputs.pr }}
          GO: ${{ steps.pr.outputs.go }}
          CONFLICT: ${{ steps.pr.outputs.conflict }}
          RESOLVED: ${{ steps.resolved.outputs.ok }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          FIRST: ${{ steps.check_first.outcome }}
          SECOND: ${{ steps.check.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          if [ "$CANCELLED" = true ]; then
            echo "::warning::cancelled; spec PR #$PR stays open"
            exit 0
          fi
          reason=.factory/human.md
          report=.factory/odin-report.md
          files() { sed '/^[[:space:]]*$/d; s/^/- /' .factory/conflict-files 2>/dev/null; }
          if [ "$GO" != true ]; then
            : # odin.sh conflict wrote .factory/human.md (the conflict rounds are used up)
          elif [ "$CONFLICT" = true ] && [ "$RESOLVED" != true ]; then
            { echo "### $BASE와의 충돌을 에이전트가 다 풀지 못했다"; echo; echo "충돌 파일:"; echo; files; } > "$reason"
          elif [ "$VERDICT" = question ]; then
            bash ${{ env.FACTORY_KIT }}/factory/odin.sh question "$SPEC" "$PR" "$report"
            exit 0
          elif [ "$VERDICT" != go ]; then
            { echo "### Odin이 판정(.factory/odin-verdict)을 남기지 않았다"; echo; cat "$report" 2>/dev/null; } > "$reason"
          elif [ "$FIRST" != success ] && [ "$SECOND" != success ]; then
            {
              echo "### 고칠 기회를 한 번 준 뒤에도 검사 실패: \`$(cat .factory/check-command 2>/dev/null)\`"
              echo
              echo '```'
              grep -E '^(error|warning)|Diff in|-->|FAILED|panicked|acceptance-probe' .factory/check.log 2>/dev/null | head -n 60
              echo '```'
              echo
              if [ "$CONFLICT" = true ]; then echo "$BASE와 충돌을 푼 파일:"; echo; files; echo; fi
              cat "$report" 2>/dev/null
            } > "$reason"
          elif [ "$PUSH" != success ]; then
            echo "### Odin의 고침을 push하지 못했다(그 사이 브랜치가 바뀌었을 수 있다)" > "$reason"
          elif bash ${{ env.FACTORY_KIT }}/factory/odin.sh pass "$SPEC" "$PR" "$report"; then
            exit 0
          else
            # The checks passed but GitHub refused the merge: main most likely moved again (#359).
            # Find what conflicts now and let a new run (mode=conflict) resolve it, within the limit.
            git fetch -q origin "$BASE"
            if git merge --no-commit --no-ff "origin/$BASE" > /dev/null 2>&1; then
              : > .factory/conflict-files
            else
              git diff --name-only --diff-filter=U > .factory/conflict-files
            fi
            git merge --abort 2> /dev/null || true
            if bash ${{ env.FACTORY_KIT }}/factory/odin.sh conflict "$SPEC" "$PR" .factory/conflict-files "$reason" --dispatch; then
              exit 0
            fi
            { echo; echo "(검사는 통과했지만 스펙 PR을 병합하지 못했다)"; echo; cat "$report" 2>/dev/null; } >> "$reason"
          fi
          cat "$reason"
          bash ${{ env.FACTORY_KIT }}/factory/odin.sh human "$SPEC" "$PR" "$reason"
