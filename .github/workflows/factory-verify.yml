# Factory task: Verify (spec #249 "Verify", docs/adr/0001-software-factory.md)
#
# The Implementer opens a PR and dispatches this run; it never merges. Verify, a different run on
# a different model, decides:
#   1. machine checks (${{ env.FACTORY_KIT }}/factory/verify.sh mech): the ticket's `#[ignore = "#N"]` lines are
#      all gone and the acceptance tests (`acceptance.glob`, $FACTORY_ACCEPTANCE_GLOB) are otherwise untouched;
#   2. the branch on today's main passes `${{ env.FACTORY_CHECK }}` (skipped when the PR head is the commit
#      the Implementer checked, `<!-- factory-checked <sha> -->`, and already sits on main);
#   3. an acceptance review on Sonnet (${{ env.FACTORY_KIT }}/factory/verify.md): every acceptance criterion met,
#      nothing out of scope.
# Pass: squash-merge, close the ticket, build main, dispatch the next ticket (verify.sh pass).
# Otherwise: send the ticket back to the Implementer with the reason (verify.sh sendback): a branch
# that conflicts with main (or fails or cannot be pushed once main is merged in) as kind=conflict,
# keeping the PR for the Implementer to resolve; anything else as kind=acceptance, closing it. A
# human gets the ticket on the second acceptance or the third conflict send-back (#307).
name: factory-verify
run-name: 'verify #${{ inputs.issue }} (PR #${{ inputs.pr }})'

on:
  workflow_call:
    inputs:
      kit-repository:
        description: owner/name of the factory kit
        type: string
        required: true
      kit-ref:
        description: tag, branch or commit of the kit (pin a tag or a commit)
        type: string
        required: true
      issue:
        type: string
        required: false
        description: Ticket number
      pr:
        type: string
        required: false
        description: The Implementer's PR for the ticket

    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  # dispatch-next.sh (after a merge or a hand-over to a human) and ledger.sh read these.
  FACTORY_SPEC_QUEUE: ${{ vars.FACTORY_SPEC_QUEUE }}
  FACTORY_SPEC_BUDGET_USD: ${{ vars.FACTORY_SPEC_BUDGET_USD }}
  FACTORY_DAILY_BUDGET_USD: ${{ vars.FACTORY_DAILY_BUDGET_USD }}
  # Implementer tracks (#286); unset means 2. 1 keeps one line for implementing and verifying.
  FACTORY_TRACKS: ${{ vars.FACTORY_TRACKS }}

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runners_default }}
      implement: ${{ steps.cfg.outputs.runners_implement }}
      verify: ${{ steps.cfg.outputs.runners_verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/factory.yml
          sparse-checkout-cone-mode: false
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"

  verify:
    needs: config
    runs-on: ${{ needs.config.outputs.verify }}
    timeout-minutes: 120
    # One Verify at a time, so every verdict is checked against the main the one before merged
    # into. With one track (FACTORY_TRACKS=1) the same group as the Implementer: implementing and
    # verifying run in one line, as before #286. A group keeps one pending run and a newer one
    # cancels it, so the last step starts Verify for any PR left waiting (verify.sh next-verify).
    concurrency:
      group: ${{ vars.FACTORY_TRACKS == '1' && 'factory-implementer' || 'factory-verify' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      N: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      - name: App token (push, pull requests, merge only)
        id: app
        if: steps.cfg.outputs.app_enabled != 'false'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Hand the App token to the push, pull request and merge commands
        if: steps.cfg.outputs.app_enabled != 'false'
        shell: bash
        run: echo "FACTORY_APP_TOKEN=${{ steps.app.outputs.token }}" >> "$GITHUB_ENV"

      - name: Budget guard
        id: budget
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh guard "$N"

      - name: Check out the PR
        id: pr
        if: steps.budget.outputs.go == 'true'
        run: |
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "::notice::PR #$PR is $state; nothing to verify"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)
          checked=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body | tr -d '\r' \
            | sed -n 's/.*<!-- factory-checked \([0-9a-f]*\) -->.*/\1/p' | tail -n 1)
          git config user.name "${{ env.FACTORY_GIT_NAME }}"
          git config user.email "${{ env.FACTORY_GIT_EMAIL }}"
          git fetch origin "$FACTORY_BASE" "+refs/heads/$branch:refs/remotes/origin/$branch"
          git switch -C "$branch" "origin/$branch"
          mkdir -p .factory
          echo ".factory/" >> .git/info/exclude
          echo "*.log" >> .git/info/exclude
          echo "::notice::PR #$PR, branch $branch at $(git rev-parse HEAD), checked ${checked:-(none)}"
          bash ${{ env.FACTORY_KIT }}/factory/ledger.sh event verify-start "$N" "pr=#$PR"
          {
            echo "go=true"
            echo "branch=$branch"
            echo "checked=$checked"
          } >> "$GITHUB_OUTPUT"

      - name: Machine checks
        id: mech
        if: steps.pr.outputs.go == 'true'
        run: |
          if bash ${{ env.FACTORY_KIT }}/factory/verify.sh mech "$N" "origin/$FACTORY_BASE" > .factory/mech.md; then r=pass; else r=fail; fi
          cat .factory/mech.md
          echo "mech=$r" >> "$GITHUB_OUTPUT"

      # `${{ env.FACTORY_CHECK }}` already passed on the checked commit; run it again only when the head
      # moved or main moved on. Main is merged in, not rebased onto (#307): a branch whose
      # conflicts the Implementer resolved carries a merge commit, and a rebase would replay its
      # commits one by one into the same conflicts again (the PR is squashed anyway). A conflict
      # sends the ticket back as kind=conflict; the Implementer then resolves it on this branch.
      - name: Merge main in
        id: base
        if: steps.mech.outputs.mech == 'pass'
        env:
          CHECKED: ${{ steps.pr.outputs.checked }}
        run: |
          head=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "origin/$FACTORY_BASE" HEAD && [ -n "$CHECKED" ] && [ "$head" = "$CHECKED" ]; then
            echo "::notice::the head is the checked commit on today's main; not running ${{ env.FACTORY_CHECK }} again"
            echo "ci=skip" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit "origin/$FACTORY_BASE"; then
            echo "ci=run" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U)
            git merge --abort
            printf '### main을 merge하면 충돌한다\n\n%s\n' "$(printf '%s\n' "$files" | sed 's/^/- /')" > .factory/conflict.md
            cat .factory/conflict.md
            echo "ci=conflict" >> "$GITHUB_OUTPUT"
            # for the ledger's per-file conflict counts (ledger.sh stats, #307)
            echo "files=$(printf '%s\n' "$files" | sed '/^$/d' | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository setup

        shell: bash

        run: ${{ env.FACTORY_SETUP || 'true' }}

      - if: env.FACTORY_CACHE == 'rust' && steps.base.outputs.ci == 'run'
        uses: Swatinem/rust-cache@v2

      - name: Automated checks
        id: ci
        if: steps.base.outputs.ci == 'run'
        run: |
          set -o pipefail
          ${{ env.FACTORY_CHECK }} 2>&1 | tee .factory/ci.log

      # The merge must land exactly what was checked.
      - name: Push the merged branch
        id: push
        if: steps.ci.outcome == 'success'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          bash "$FACTORY_KIT/factory/app-git.sh"
          git push --force-with-lease="$BRANCH" origin "$BRANCH"

      - name: Install Claude Code
        id: claude
        if: >-
          steps.mech.outputs.mech == 'pass' &&
          (steps.base.outputs.ci == 'skip' || steps.ci.outcome == 'success')
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
          if (-not (Test-Path $exe)) { throw "claude.exe not found at $exe" }
          & $exe --version
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Acceptance review
        if: steps.claude.outcome == 'success'
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Verify run of this repo's software factory.
            Ticket: #${{ inputs.issue }} in ${{ github.repository }}, PR #${{ inputs.pr }} (checked out as HEAD).
            Read ${{ env.FACTORY_KIT }}/factory/verify.md and follow it exactly.
          claude_args: >-
            --model ${{ env.FACTORY_MODELS_VERIFY }}
            --max-turns ${{ env.FACTORY_TURNS_VERIFY }}
            --allowedTools "Bash(gh:*),Bash(git diff:*),Bash(git log:*),Read,Write,Glob,Grep"

      - name: Record cost (verify)
        if: always() && steps.budget.outputs.go == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record verify "$N"

      - name: Merge or send back
        if: always() && steps.pr.outputs.go == 'true'
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          MECH: ${{ steps.mech.outputs.mech }}
          BASE: ${{ steps.base.outputs.ci }}
          CI_OUTCOME: ${{ steps.ci.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          CONFLICT_FILES: ${{ steps.base.outputs.files }}
        run: |
          # the verdict and the conflicting files, for the ledger's conflict send-back ratio and
          # per-file conflict counts (ledger.sh stats, #286, #307)
          outcome=stopped
          trap 'bash ${{ env.FACTORY_KIT }}/factory/ledger.sh event verify-end "$N" "pr=#$PR" "outcome=$outcome" ${CONFLICT_FILES:+"files=$CONFLICT_FILES"}' EXIT
          if [ "$CANCELLED" = true ]; then
            echo "::warning::cancelled; PR #$PR stays open and #$N in progress"
            outcome=cancelled
            exit 0
          fi
          reason=.factory/sendback.md
          # conflict, rebase-ci and push: the branch does not go onto today's main. The
          # Implementer resolves that on this PR's branch instead of implementing again (#307).
          kind=acceptance
          verdict=$(tr -d '[:space:]' < .factory/verify-verdict 2>/dev/null || true)
          if [ "$MECH" != pass ]; then
            outcome=mech
            { echo "### 기계 검사 실패"; echo; cat .factory/mech.md 2>/dev/null; } > "$reason"
          elif [ "$BASE" = conflict ]; then
            outcome=conflict kind=conflict
            cp .factory/conflict.md "$reason"
          elif [ "$BASE" = run ] && [ "$CI_OUTCOME" != success ]; then
            outcome=rebase-ci kind=conflict
            {
              echo "### main을 merge한 뒤 \`${{ env.FACTORY_CHECK }}\` 실패"
              echo
              echo '```'
              grep -E 'error|FAILED|panicked|ci:' .factory/ci.log 2>/dev/null | tail -n 60
              echo '```'
            } > "$reason"
          elif [ "$BASE" = run ] && [ "$PUSH_OUTCOME" != success ]; then
            outcome=push kind=conflict
            echo "### main을 merge한 브랜치를 push하지 못했다(그 사이 브랜치가 바뀌었을 수 있다)" > "$reason"
          elif [ "$verdict" != pass ]; then
            outcome=review
            {
              if [ "$verdict" = fail ]; then echo "### 인수 판단: 실패"; else echo "### 인수 판단이 결론을 남기지 않았다"; fi
              echo
              cat .factory/verify-report.md 2>/dev/null
            } > "$reason"
          elif bash ${{ env.FACTORY_KIT }}/factory/verify.sh pass "$N" "$PR" .factory/verify-report.md; then
            outcome=merged
            exit 0
          else
            outcome=merge-failed
            { echo "### 판단은 통과였지만 PR을 병합하지 못했다"; echo; cat .factory/verify-report.md 2>/dev/null; } > "$reason"
          fi
          cat "$reason"
          bash ${{ env.FACTORY_KIT }}/factory/verify.sh sendback "$N" "$PR" "$reason" "$kind"

      # Nothing to verify (the PR is no longer open) or the guard stopped the run: keep the chain
      # going unless the daily budget is spent (the Implementer's schedule resumes after KST
      # midnight). A ticket stopped here keeps `state:running` and its open PR; dispatch this
      # workflow again for it once its spec may run.
      - name: Dispatch next ticket
        if: always() && steps.pr.outputs.go != 'true' && steps.budget.outputs.reason != 'daily'
        run: bash ${{ env.FACTORY_KIT }}/factory/dispatch-next.sh

      # Verify runs one at a time in its group, which keeps one pending run: a newer hand-over
      # cancels an older pending one. Start Verify for a PR left waiting that way (#286).
      - name: Start Verify for a waiting PR
        if: always() && vars.FACTORY_TRACKS != '1'
        run: bash ${{ env.FACTORY_KIT }}/factory/verify.sh next-verify "$PR"
