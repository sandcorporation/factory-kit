# Factory task: Implementer (docs/adr/0001-software-factory.md)
#
# A human approves a ticket by labelling it `state:ready`. A run starts only
# when every blocker of the ticket is closed; otherwise the label stays and the
# `frontier` job dispatches the ticket once its last blocker closes.
#
# The agent edits and commits (lifting only its own ticket's acceptance-test ignores). The
# workflow itself runs `${{ env.FACTORY_CHECK }}`, pushes and opens the PR, and hands it to
# factory-verify.yml (spec #249), which checks the PR and merges it or sends the ticket back.
# This workflow never merges.
#
# Conflict mode (#307, `mode` input, auto by default): when Verify sent the ticket back because its
# branch conflicts with today's main, the run checks out the open PR's branch, merges main in, lets
# the agent resolve the conflicts (the "Resolve conflicts" step), passes `${{ env.FACTORY_CHECK }}`, pushes
# and hands the same PR to Verify again. It does not implement the ticket again.
name: factory-implementer
# Dispatched runs carry the ticket and the track in their title: dispatch-next.sh reads it to find
# the busy tracks and tickets (#286).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('implement #{0} (track {1})', inputs.issue, inputs.track || '1')
  || format('factory-implementer {0}', github.event_name) }}

on:
  workflow_call:
    inputs:
      kit-repository:
        description: owner/name of the factory kit
        type: string
        required: true
      kit-ref:
        description: tag, branch or commit of the kit (pin a tag or a commit)
        type: string
        required: true
      issue:
        type: string
        required: false
        description: Ticket number to implement
      track:
        type: string
        required: false
        description: Implementer track (1..FACTORY_TRACKS); dispatch-next.sh picks an empty one
      mode:
        type: string
        required: false
        description: >-
          auto (default): resolve conflicts only when Verify's last send-back of the ticket was a
          conflict and its PR is still open (verify.sh conflict-pr), else implement;
          implement: implement from main; conflict: resolve conflicts on the open PR only (#307)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

env:
  # Spec issues in roadmap order, from the repository variable (spec #249). Empty: the factory
  # never moves on to another spec by itself (the trial runs only the spec labelled `spec`).
  FACTORY_SPEC_QUEUE: ${{ vars.FACTORY_SPEC_QUEUE }}
  # Implementer tracks (#286): tickets implemented at once. Empty means 2; 1 is the serial chain.
  FACTORY_TRACKS: ${{ vars.FACTORY_TRACKS }}
  # Budgets of ${{ env.FACTORY_KIT }}/factory/ledger.sh (spec #249 "비용 장부와 상한"); empty means its defaults.
  FACTORY_SPEC_BUDGET_USD: ${{ vars.FACTORY_SPEC_BUDGET_USD }}
  FACTORY_DAILY_BUDGET_USD: ${{ vars.FACTORY_DAILY_BUDGET_USD }}

# One run per ticket (#286): two dispatch-next.sh calls at the same moment can dispatch the same
# ticket on two tracks. The second run then waits here until the first claimed the ticket, and its
# guard finds the ticket no longer `state:ready`. Other events get a group of their own.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
    && format('factory-ticket-{0}', inputs.issue)
    || format('factory-implementer-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runners_default }}
      implement: ${{ steps.cfg.outputs.runners_implement }}
      verify: ${{ steps.cfg.outputs.runners_verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/factory.yml
          sparse-checkout-cone-mode: false
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"

  # A ticket closed (usually by a merged PR): fill the empty tracks with approved tickets whose
  # blockers are now all closed.
  frontier:
    needs: config
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      - name: Fill the empty tracks
        run: bash ${{ env.FACTORY_KIT }}/factory/dispatch-next.sh --tickets-only

  # A ticket labelled `state:ready`: start it on an empty track, if one is empty and nothing
  # with a lower number goes first. A run does not implement on this event any more: a track's
  # concurrency group would cancel a pending run silently (#286).
  approved:
    needs: config
    if: github.event.action == 'labeled' && github.event.label.name == 'state:ready'
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      # `state:ready` needs a parent spec (sub-issue parent or `## Parent` section): without one
      # the label comes off with a comment and nothing starts. Only a writer's label counts (#389).
      - name: Require a parent spec
        id: parent
        env:
          ISSUE: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
        run: bash ${{ env.FACTORY_KIT }}/factory/parent-check.sh "$ISSUE" "$SENDER"
      # A ticket that changes `.github/workflows/` is a local worker's (`state:human` + `local`).
      - name: Keep workflow tickets out
        id: local
        if: steps.parent.outputs.ok == 'true'
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: bash ${{ env.FACTORY_KIT }}/factory/local-ticket.sh "$ISSUE"
      - name: Fill the empty tracks
        if: steps.parent.outputs.ok == 'true' && steps.local.outputs.local != 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/dispatch-next.sh --tickets-only --candidates "${{ github.event.issue.number }}"

  # Daily after KST midnight: fill the empty tracks (dispatch-next.sh skips busy ones).
  resume:
    needs: config
    if: github.event_name == 'schedule'
    runs-on: ${{ needs.config.outputs.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      - name: Dispatch next ticket
        run: bash ${{ env.FACTORY_KIT }}/factory/dispatch-next.sh

  implement:
    needs: config
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.config.outputs.implement }}
    timeout-minutes: 180
    # One ticket per track (#286, decision 2026-11-15 for one track): parallel runs on one track
    # kept editing the same files. A group keeps at most one pending run and cancels older pending
    # ones, so dispatch-next.sh dispatches only into a track with no run. A run hands its PR to
    # Verify (factory-verify.yml, a serial group of its own) and then refills the tracks (the
    # "Dispatch next ticket" step). A cancelled run leaves its ticket labelled `state:ready`,
    # so a later call picks it up. With FACTORY_TRACKS=1 the run shares the group with Verify as
    # before the tracks.
    concurrency:
      group: >-
        ${{ vars.FACTORY_TRACKS == '1' && 'factory-implementer'
        || format('factory-impl-{0}', inputs.track || '1') }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      N: ${{ inputs.issue }}
      TRACK: ${{ inputs.track || '1' }}
      BRANCH: agent/issue-${{ inputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # Line tables only (no full debug info) in dev/test builds: the workspace links about 60
      # test binaries, and full PDBs make each link slower. Backtraces keep file and line.
      # The agent's builds and the checks share this, so the checks reuse the agent's artifacts.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Factory kit and settings
        id: cfg
        shell: bash
        env:
          KIT: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          d="$RUNNER_TEMP/factory-kit"
          git init -q "$d" && git -C "$d" fetch -q --depth 1 "https://github.com/$KIT" "$KIT_REF" && git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          echo "FACTORY_KIT=$d" >> "$GITHUB_ENV"
          bash "$d/factory/config.sh"
      - name: App token (push, pull requests, merge only)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Hand the App token to the push, pull request and merge commands
        shell: bash
        run: echo "FACTORY_APP_TOKEN=${{ steps.app.outputs.token }}" >> "$GITHUB_ENV"

      # Spec #249 "비용 장부와 상한": before claiming, stop on wait:decision / wait:budget and
      # on the spec and daily budgets. A stopped ticket keeps `state:ready`.
      - name: Budget guard
        id: budget
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh guard "$N"

      - name: Guard and claim
        id: guard
        if: steps.budget.outputs.go == 'true'
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          read -r state labels < <(gh issue view "$N" --repo "$REPO" --json state,labels --jq '[.state, ([.labels[].name] | join(","))] | @tsv')
          go=true
          if [ "$state" != "OPEN" ]; then echo "::notice::#$N is not open"; go=false; fi
          case ",$labels," in *,state:ready,*) ;; *) echo "::notice::#$N is not labelled state:ready"; go=false;; esac
          if $go; then
            open=$(gh api "repos/$REPO/issues/$N" --jq '.issue_dependencies_summary.blocked_by // 0')
            if [ "$open" -gt 0 ]; then
              echo "::notice::#$N has $open open blocker(s); the frontier job will dispatch it later"
              go=false
            fi
          fi
          # Conflict mode (#307): Verify sent the ticket back because its branch conflicts with
          # main (or fails or cannot be pushed with main merged in) and kept the PR open. Then this
          # run only merges main into that branch and resolves; it does not implement again.
          mode=implement pr=
          if $go && [ "${MODE_INPUT:-auto}" != implement ]; then
            pr=$(bash ${{ env.FACTORY_KIT }}/factory/verify.sh conflict-pr "$N")
            if [ -n "$pr" ]; then
              mode=conflict
            elif [ "$MODE_INPUT" = conflict ]; then
              echo "::error::#$N: mode=conflict, but its last send-back is no conflict or its PR is closed"
              go=false
            fi
          fi
          # A ticket without a parent spec does not start (parent-check.sh takes the label off), and a
          # ticket that changes workflow files is left to a local worker (local-ticket.sh, #389).
          if $go; then
            ok=$(env -u GITHUB_OUTPUT bash ${{ env.FACTORY_KIT }}/factory/parent-check.sh "$N" | sed -n 's/^ok=//p' | tail -n 1)
            if [ "$ok" != true ]; then echo "::notice::#$N has no parent spec; not started"; go=false; fi
          fi
          if $go; then
            lc=$(env -u GITHUB_OUTPUT bash ${{ env.FACTORY_KIT }}/factory/local-ticket.sh "$N" | sed -n 's/^local=//p' | tail -n 1)
            if [ "$lc" = true ]; then echo "::notice::#$N changes workflow files; left to a local worker"; go=false; fi
          fi
          if $go; then
            gh issue edit "$N" --repo "$REPO" --remove-label state:ready --add-label state:running
            # Measurement (#286): the wait from `state:ready` to this start, per track.
            if [ "$mode" = conflict ]; then
              echo "::notice::#$N: resolving conflicts with main on PR #$pr"
              bash ${{ env.FACTORY_KIT }}/factory/ledger.sh event impl-start "$N" "track=$TRACK" mode=conflict "pr=#$pr"
            else
              bash ${{ env.FACTORY_KIT }}/factory/ledger.sh event impl-start "$N" "track=$TRACK"
            fi
          fi
          {
            echo "go=$go"
            echo "mode=$mode"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
          # Model: the ticket's model label (set by Decompose), Sonnet when there is none,
          # and Opus for any retry after a code failure (the checks failed; an
          # infrastructure failure retries on the same model, see "Record failure") or after
          # Verify sent the ticket back (`<!-- factory-sendback` of any kind, spec #249, #307).
          # Opus only for hard tickets (Windows API, OLE, concurrency safety); never Fable.
          model=${{ env.FACTORY_MODELS_DEFAULT }}
          case ",$labels," in *,model:strong,*) model=${{ env.FACTORY_MODELS_STRONG }};; esac
          # shellcheck disable=SC2016 # jq program, not shell
          fails=$(gh issue view "$N" --repo "$REPO" --json comments --jq '[.comments[].body] | (map(startswith("<!-- factory-reset -->")) | rindex(true)) as $r | [.[(if $r == null then 0 else $r + 1 end):][] | select(contains("<!-- factory-implementer-failed -->") or startswith("<!-- factory-sendback"))] | length')
          if [ "$fails" -gt 0 ]; then model=${{ env.FACTORY_MODELS_STRONG }}; fi
          echo "::notice::#$N runs on $model (earlier code failures and send-backs: $fails)"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      # Conflict mode (#307) goes on from the open PR's branch; otherwise a new branch from main.
      - name: Prepare branch
        if: steps.guard.outputs.go == 'true'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          git config user.name "${{ env.FACTORY_GIT_NAME }}"
          git config user.email "${{ env.FACTORY_GIT_EMAIL }}"
          if [ "$MODE" = conflict ]; then
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
          mkdir -p .factory
          echo ".factory/" >> .git/info/exclude
          # Logs the agent writes while checking (ci.log must not land in the PR.
          echo "*.log" >> .git/info/exclude

      - name: Repository setup

        shell: bash

        run: ${{ env.FACTORY_SETUP || 'true' }}

      - if: env.FACTORY_CACHE == 'rust' && steps.guard.outputs.go == 'true'
        uses: Swatinem/rust-cache@v2

      # The action's own installer is a shell script that refuses Windows, so install
      # the native Windows build and hand the action its path.
      - name: Install Claude Code
        id: claude
        if: steps.guard.outputs.go == 'true'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
          if (-not (Test-Path $exe)) { throw "claude.exe not found at $exe" }
          & $exe --version
          "path=$exe" >> $env:GITHUB_OUTPUT

      # Not in conflict mode (#307): the ticket is implemented on the PR's branch already.
      - name: Implement
        if: steps.guard.outputs.go == 'true' && steps.guard.outputs.mode != 'conflict'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Runs dispatched by this workflow itself (frontier, next tickets) have the bot as actor.
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run of this repo's software factory.
            Ticket: #${{ env.N }} in ${{ github.repository }}. You are on branch ${{ env.BRANCH }}.
            Read ${{ env.FACTORY_KIT }}/factory/implementer.md and follow it exactly.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns ${{ env.FACTORY_TURNS_IMPLEMENT }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      # The action's log hides the agent's commands (show_full_output would also print tool
      # output, which may carry secrets in a public repo). Print only the shell commands it ran,
      # so slow or backgrounded commands show up in the run log.
      - name: Agent commands
        if: always() && steps.guard.outputs.go == 'true' && steps.guard.outputs.mode != 'conflict'
        continue-on-error: true
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$f" ] || { echo "no execution log"; exit 0; }
          jq -r '(if type == "array" then .[] else . end)
            | select(.type == "assistant") | .message.content[]?
            | select(.type == "tool_use" and .name == "Bash")
            | (if .input.run_in_background then "[background] " else "" end) + (.input.command | gsub("\n"; " ") | .[0:200])' "$f" || true

      # Cost ledger (spec #249). After "Agent commands", which reads the same execution file:
      # recording moves it away so a later stage does not count it again.
      - name: Record cost (implement)
        if: always() && steps.guard.outputs.go == 'true' && steps.guard.outputs.mode != 'conflict'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record implementer "$N"

      # Put the agent's commits on top of today's main: sibling tickets or factory changes
      # may have landed during the run. Pushing a branch based on an older main also
      # counts as editing workflow files, which GITHUB_TOKEN may not do.
      # On a conflict, fall back to a merge and let the agent resolve it (the PR is squashed anyway).
      # Conflict mode (#307): no agent ran yet and the branch already carries the PR's work: merge
      # main into it (as Verify does), and let the agent resolve what conflicts.
      - name: Rebase onto main
        id: rebase
        if: steps.guard.outputs.go == 'true'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          if [ "$MODE" = conflict ]; then
            git fetch origin "$FACTORY_BASE"
            echo "main=$(git rev-parse "origin/$FACTORY_BASE")" >> "$GITHUB_OUTPUT"
            if git merge --no-edit "origin/$FACTORY_BASE"; then
              echo "::notice::main merges into the PR's branch cleanly now"
              echo "conflict=false" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::conflicts with main: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The agent sometimes ends with staged or unstaged edits it never committed
          #, which stops the rebase. If it committed work, add the
          # leftovers on top (the automated checks below still judge the result). If it
          # made no commits it may have stopped on purpose (implementer.md section 4),
          # so drop them and let "the agent made no commits" fail the run.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            if [ "$(git rev-list --count "origin/$FACTORY_BASE"..HEAD)" -gt 0 ]; then
              echo "::warning::the agent left uncommitted changes; committing them"
              git add -A
              git commit -q -m "에이전트가 커밋하지 않은 변경을 남긴다"
              # Line-ending conversion can leave the just-committed files "modified" again,
              # which stops the rebase ("You have unstaged changes".
              git reset -q --hard
            else
              echo "::warning::the agent left uncommitted changes and made no commits; dropping them"
              git reset -q --hard
              git clean -fdq
            fi
          fi
          git fetch origin "$FACTORY_BASE"
          echo "main=$(git rev-parse "origin/$FACTORY_BASE")" >> "$GITHUB_OUTPUT"
          if git rebase "origin/$FACTORY_BASE"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            git merge --no-edit "origin/$FACTORY_BASE" || true
            echo "::warning::conflicts with main: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve conflicts
        if: steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run for ticket #${{ env.N }} in ${{ github.repository }}.
            You already implemented the ticket on branch ${{ env.BRANCH }}. Other tickets merged into
            main meanwhile, and merging origin/${{ env.FACTORY_BASE }} left conflicts (see `git status`).
            Resolve every conflict so that both your ticket's behaviour and main's changes survive.
            Never drop main's changes to make yours fit. Then run `${{ env.FACTORY_CHECK }}` until it passes.
            Do not commit, abort the merge or push: the workflow stages your work and makes the
            merge commit after you end, and fails the run if a conflict or a conflict marker is left.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns ${{ env.FACTORY_TURNS_CONFLICTS }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      # Make the merge commit the conflict agent was asked not to make (#434): it resolved the
      # conflicts and ended without committing in runs 44389000388 and 44393130003 (#342). Fails when
      # a path is still unmerged or a conflict marker is among the merge's added lines.
      - name: Finish merge
        id: finish
        if: steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/merge-check.sh finish

      # What the conflict agent said last and which commands it ran, in the run summary (#434).
      # Only those: the full execution log stays off this public repository. Masked values (`***`)
      # and token shapes are taken out. Before "Record cost (conflicts)", which moves the file away.
      - name: Conflict agent summary
        if: always() && steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ${{ env.FACTORY_KIT }}/factory/agent-summary.sh "$RUNNER_TEMP/claude-execution-output.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Record cost (conflicts)
        if: always() && steps.guard.outputs.go == 'true' && steps.rebase.outputs.conflict == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record implementer-conflicts "$N"

      # No commits means nothing to check: fail here instead of after the 4-minute checks
      # (runs 43909075691, 43922416562). Counts as an infrastructure failure, as before.
      - name: Require commits
        id: commits
        if: steps.guard.outputs.go == 'true'
        run: |
          if [ "$(git rev-list --count "origin/$FACTORY_BASE"..HEAD)" -eq 0 ]; then
            echo "::error::the agent made no commits"; exit 1
          fi

      # The branch must carry the main the rebase step fetched, with no merge or rebase left
      # half-done (#434): a conflict-mode run whose agent ended without merging passed "Require
      # commits" on the ticket's old commits, pushed nothing new, and went to Verify, which sent it
      # back for the same conflict until the limit ran out (#342, runs 44389000388 and 44393130003).
      # Counted as a code failure with the reason in the comment, without the checks, push or Verify.
      - name: Require main merged
        id: merged
        if: steps.guard.outputs.go == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/merge-check.sh check "${{ steps.rebase.outputs.main }}"

      # Commits that touch `.github/workflows/` cannot be pushed (GITHUB_TOKEN has no `workflows`
      # permission): hand the ticket to a person now, before the checks. No failure is counted and
      # nothing is dispatched again (workflow-guard.sh, #389).
      - name: Workflow file guard
        id: wfguard
        if: steps.guard.outputs.go == 'true'
        run: bash ${{ env.FACTORY_KIT }}/factory/workflow-guard.sh check "$N" "origin/$FACTORY_BASE" || true

      # Deterministic gate: the agent's word is not enough.
      # Processes the agent left running lock their
      # executables, and the build then cannot rebuild them (checks.kill).
      # A first failure goes back to the agent in the same run with the log (below) instead of
      # throwing the whole run away; only the second check decides the run.
      - name: Automated checks (first)
        id: checks_first
        if: steps.guard.outputs.go == 'true' && steps.wfguard.outputs.blocked != 'true'
        continue-on-error: true
        run: |
          for exe in $FACTORY_CHECKS_KILL; do
            taskkill //F //T //IM "$exe" >/dev/null 2>&1 || true
          done
          ${{ env.FACTORY_CHECK }} 2>&1 | tee .factory/ci.log

      - name: Fix failed checks
        if: steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            You are the Implementer run for ticket #${{ env.N }} in ${{ github.repository }}, on branch ${{ env.BRANCH }}.
            You implemented the ticket and committed. The workflow then ran `${{ env.FACTORY_CHECK }}`, and it failed.
            Its output is in .factory/ci.log (large: search it for "error", "FAILED", "panicked" and the
            stage lines instead of reading it whole). Follow ${{ env.FACTORY_KIT }}/factory/implementer.md.
            Find the cause and fix it. If a test failed because of timing on the shared runner rather than
            your change, rerun just that test to confirm, and fix the test only if it is genuinely racy.
            Check your fix with the failing stage or test only (the workflow runs the whole
            `${{ env.FACTORY_CHECK }}` again after you), commit, and do not push.
          claude_args: >-
            --model ${{ steps.guard.outputs.model }}
            --max-turns ${{ env.FACTORY_TURNS_FIX }}
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Record cost (fix)
        if: always() && steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        run: bash ${{ env.FACTORY_KIT }}/factory/ledger.sh record implementer-fix "$N"

      - name: Automated checks
        id: checks
        if: steps.guard.outputs.go == 'true' && steps.checks_first.outcome == 'failure'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::the agent left uncommitted changes after fixing; committing them"
            git add -A
            git commit -q -m "에이전트가 커밋하지 않은 변경을 남긴다"
          fi
          for exe in $FACTORY_CHECKS_KILL; do
            taskkill //F //T //IM "$exe" >/dev/null 2>&1 || true
          done
          ${{ env.FACTORY_CHECK }}

      # The PR body carries `Closes #N` and the commit `${{ env.FACTORY_CHECK }}` passed on
      # (`<!-- factory-checked <sha> -->`): Verify skips its own `${{ env.FACTORY_CHECK }}` when the PR head is
      # still that commit and sits on today's main.
      - name: Push and open PR
        id: pr
        if: steps.guard.outputs.go == 'true' && steps.wfguard.outputs.blocked != 'true'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          CONFLICT_PR: ${{ steps.guard.outputs.pr }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$MODE" = conflict ]; then
            # Conflict mode merges main on top of the PR branch, so history is not rewritten: a plain
            # push. If someone pushed to the branch meanwhile it is refused instead of dropping their
            # commits (#504).
            pushargs=(origin "$BRANCH")
          else
            # A fresh implementation starts from main and replaces an earlier attempt's branch.
            pushargs=(--force origin "$BRANCH")
          fi
          bash "$FACTORY_KIT/factory/app-git.sh"
          if git push "${pushargs[@]}" 2> .factory/push.log; then
            cat .factory/push.log
          else
            cat .factory/push.log
            # A refused workflow file is for a person, not a failure to count or retry (#389), unless
            # main changed one during this run and the branch touches none: then catch up with main
            # (conflict mode merges, else rebase) and push once more (#417). The PR keeps `$sha` as
            # the checked commit: the caught-up head was not checked, so Verify runs `${{ env.FACTORY_CHECK }}`.
            rc=0
            bash ${{ env.FACTORY_KIT }}/factory/workflow-guard.sh push-retry "$N" .factory/push.log "$MODE" "${pushargs[@]}" || rc=$?
            case $rc in
              0) ;;
              3) exit 0 ;;
              *) exit 1 ;;
            esac
          fi
          body=.factory/pr-body.md
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$MODE" = conflict ]; then
            # Keep the PR's body (its checked markers are stale since the send-back) and add the
            # newly checked commit, which Verify reads as the last one (#307).
            gh pr view "$CONFLICT_PR" --repo "$REPO" --json body --jq .body | tr -d '\r' > "$body"
            printf '\n\n_Conflicts with main resolved by the factory Implementer run: %s_\n\n<!-- factory-checked %s -->\n' \
              "$run" "$sha" >> "$body"
          else
            [ -s "$body" ] || echo "(the agent wrote no PR body)" > "$body"
            printf '\n\nCloses #%s\n\n_Opened by the factory Implementer run: %s_\n\n<!-- factory-checked %s -->\n' "$N" \
              "$run" "$sha" >> "$body"
          fi
          title=$(gh issue view "$N" --repo "$REPO" --json title --jq .title)
          url=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$url" ]; then
            gh pr edit "$url" --body-file "$body"
          else
            url=$(GH_TOKEN="${{ steps.app.outputs.token }}" gh pr create --repo "$REPO" --base "$FACTORY_BASE" --head "$BRANCH" --title "$title" --body-file "$body")
          fi
          number=$(gh pr view "$url" --repo "$REPO" --json number --jq .number)
          echo "PR: $url"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The Implementer does not merge (spec #249): Verify checks the PR (machine checks, acceptance
      # review), then merges it and moves the chain on, or sends the ticket back. Verify is serial
      # (one group, factory-verify.yml); with FACTORY_TRACKS=1 it shares this run's group, so it runs
      # right after this run and before any next ticket.
      - name: Hand over to Verify
        id: handover
        if: >-
          steps.guard.outputs.go == 'true' && steps.wfguard.outputs.blocked != 'true'
          && steps.pr.outputs.blocked != 'true'
        run: |
          gh workflow run "${FACTORY_VERIFY_WORKFLOW:-factory-verify.yml}" --repo "$REPO" -f issue="$N" -f pr="${{ steps.pr.outputs.number }}"
          bash ${{ env.FACTORY_KIT }}/factory/ledger.sh event impl-end "$N" "track=$TRACK"

      # A code failure (the automated checks failed) counts toward the model rule: one puts the
      # ticket back in the queue and the retry runs on Opus, two leave it to the managing session
      # (`state:human`, ADR-0001).
      # Any other failure (runner, network, installer, agent action crash) has nothing to do
      # with the code: retry on the same model (decision 2026-11-16), and hand the ticket
      # to the managing session only after three of them. A run whose agent left the
      # `<!-- factory-implementer-blocked -->` comment goes to a person at once. Only failures after
      # the last `<!-- factory-reset -->` comment count; record-failure.sh does it all (#410).
      - name: Record failure
        if: failure() && steps.guard.outputs.go == 'true'
        env:
          FAILURE_REASON: ${{ steps.finish.outputs.reason || steps.merged.outputs.reason }}
        run: |
          if [ "${{ steps.checks.outcome }}" = failure ] || [ "${{ steps.merged.outcome }}" = failure ] \
             || [ "${{ steps.finish.outcome }}" = failure ]; then
            what=code
          else
            what=infra
          fi
          # No commits (#414): a comment the agent left on the ticket since this run started is its
          # reason for stopping; record-failure.sh then hands the ticket to a person without counting.
          started=
          if [ "${{ steps.commits.outcome }}" = failure ]; then
            started=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at) || started=
          fi
          bash ${{ env.FACTORY_KIT }}/factory/record-failure.sh "$N" "$what" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$started"

      # Refill the tracks (#286): this run's track is free once it ends (dispatch-next.sh does not
      # count the run calling it), so the next ticket waits in the track's group for this run only.
      # With FACTORY_TRACKS=1 a run that handed its PR over leaves this to Verify, as before the
      # tracks: Verify shares the group, and a second pending run would cancel it.
      - name: Dispatch next ticket
        if: always() && (steps.handover.outcome != 'success' || vars.FACTORY_TRACKS != '1')
        run: |
          sleep 10
          # A run stopped by the daily budget does not look for another ticket: none may start.
          if [ "${{ steps.budget.outputs.reason }}" = daily ]; then exit 0; fi
          bash ${{ env.FACTORY_KIT }}/factory/dispatch-next.sh
